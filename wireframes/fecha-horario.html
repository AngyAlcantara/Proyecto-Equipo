<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fecha y horario - Pipas Juárez</title>
  <link rel="stylesheet" href="fecha-horario.css">
</head>
<body>
  <div class="container">
    
    <!-- Encabezado con flecha y subtítulo -->
    <header class="header">
      <div class="header-top">
        <button class="btn-back" onclick="history.back()">&larr;</button>
        <h2>Fecha y horario</h2>
      </div>
      <p class="subtitle">Pipas Juárez</p>
    </header>

    <!-- Formulario con recuadros vacíos -->
    <main class="form-container">
      <form id="schedule-form">
        
        <!-- Campo Fecha -->
        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="text" id="fecha" name="fecha" placeholder="[DD/MM/AAAA]">
        </div>

        <!-- Campos de Horarios -->
        <div class="form-group">
          <label for="horario1">Horario</label>
          <input type="text" id="horario1" name="horario1" placeholder="[00:00 - 00:00]">
        </div>

        <div class="form-group">
          <input type="text" id="horario2" name="horario2" placeholder="[00:00 - 00:00]">
        </div>

        <!-- Campo Otro -->
        <div class="form-group">
          <label for="otro">Otro</label>
          <input type="text" id="otro" name="otro" placeholder="">
        </div>

        <!-- Botón Continuar -->
        <button type="submit" class="btn-submit">CONTINUAR</button>
      </form>
    </main>

  </div>
</body>
</html>
