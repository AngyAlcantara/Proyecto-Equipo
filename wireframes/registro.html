<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Pipas Juárez</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>

  <main class="card-container">
    <!-- Encabezado con flecha y nombre de la app -->
    <header class="header">
      <span class="back-icon" aria-label="Volver">&larr;</span>
      <h2 class="app-title">Pipas Juárez</h2>
    </header>

    <!-- Título Principal -->
    <h1 class="screen-title">CREAR CUENTA</h1>

    <!-- Nombre decorativo como en el boceto -->
    <p class="subtitle-tag">angeles</p>

    <!-- Formulario de Registro -->
    <form class="register-form">
      
      <div class="input-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre" required>
      </div>

      <div class="input-group">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ingrese un numero de teléfono" required>
      </div>

      <div class="input-group">
        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="Ingrese un correo" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa una contraseña" required>
      </div>

      <button type="submit" class="submit-btn">CREAR CUENTA</button>

    </form>
  </main>

</body>
</html>
