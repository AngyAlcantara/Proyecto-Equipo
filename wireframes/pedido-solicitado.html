<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido Solicitado - Pipas Juárez</title>
  <link rel="stylesheet" href="pedido-solicitado.css">
</head>
<body>
  <div class="container">
    
    <!-- Encabezado con Ícono y Título -->
    <div class="status-header">
      <div class="check-icon">✓</div>
      <div class="status-title">
        <h2>¡Pedido solicitado!</h2>
        <p class="order-id">Pedido #PJ-001</p>
      </div>
    </div>

    <!-- Mensaje de notificación -->
    <p class="notification-text">¡Te notificaremos cuando cambie su estado!</p>

    <!-- Botones de Acción -->
    <div class="actions">
      <button class="btn-action">Ver pedido</button>
      <button class="btn-action">Volver al inicio</button>
    </div>
</body>
</html>
