<div class="container">
  <h2>Cambiar contraseña</h2>

  <form (ngSubmit)="cambiarPassword()">
    <div class="form-group">
      <label>Contraseña actual</label>
      <input type="password" [(ngModel)]="passActual" name="passActual" placeholder="Ingrese su contraseña actual" required>
    </div>

    <div class="form-group">
      <label>Nueva contraseña</label>
      <input type="password" [(ngModel)]="passNueva" name="passNueva" placeholder="Ingrese su nueva contraseña" required>
    </div>

    <div class="form-group">
      <label>Confirmar nueva contraseña</label>
      <input type="password" [(ngModel)]="passConfirm" name="passConfirm" placeholder="Confirme su nueva contraseña" required>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>
